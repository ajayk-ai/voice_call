# Deploy on this server:  docker compose up -d --build
#
# Host networking: the containers reach the host PostgreSQL at localhost (PO_DB_HOST=localhost), so PostgreSQL
# stays closed to the network. The app is reached directly at http://<server-ip>:8082 (no reverse proxy, no HTTPS).
x-app: &app
  image: po-agent:latest
  network_mode: host
  # Same uid as the owner of .env / service.json (mode 600) so the key file stays unreadable to other users
  user: "${APP_UID:-1001}:${APP_GID:-1001}"
  env_file: .env
  restart: unless-stopped
  volumes:
    # Google service account key (GOOGLE_SERVICE_ACCOUNT_FILE=service.json in .env)
    - ./service.json:/app/service.json:ro

services:
  app:
    <<: *app
    build: .
    container_name: po-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Live sheet -> PostgreSQL mirror (optional: production runs also sync just before they start)
  sync:
    <<: *app
    container_name: po-sync
    command: ["python", "-m", "backend.po_sync"]
