[project]
name = "voice-call"
version = "0.1.0"
description = "PO follow-up voice agent (FreJun + Gemini Live) and a live Google Sheet -> PostgreSQL sync"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.115.0",
    "google-auth>=2.32",
    "google-genai>=2.28.0",
    "gspread>=6.1",
    "httpx>=0.27",
    "langsmith>=0.4",
    "numpy>=2.5.3",
    "python-dotenv==1.0.1",
    "teler>=1.0.0",
    "truststore>=0.10.4",
    "tzdata>=2024.1",
    "uvicorn[standard]==0.30.6",
    "websockets>=14.0",
]

[project.optional-dependencies]
# Local-only PO sheet sync (python -m backend.po_sync)
sync = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Deprecations inside FastAPI/Starlette/google-genai on Python 3.14; ours still show
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:google.genai.*",
]

# Lint: uvx ruff check .  (also run in CI)
[tool.ruff]
line-length = 130
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6", "B006"]
ignore = ["E741"]  # `l` for a PO line is used throughout
