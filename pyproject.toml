[project]
name = "voice-call"
version = "0.1.0"
description = "PO follow-up voice agent (FreJun + Gemini Live) and a live Google Sheet -> PostgreSQL sync"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.115.0",
    "google-genai>=2.28.0",
    "httpx>=0.27",
    "numpy>=2.5.3",
    "python-dotenv==1.0.1",
    "teler>=1.0.0",
    "truststore>=0.10.4",
    "uvicorn[standard]==0.30.6",
    "websockets>=14.0",
]

[project.optional-dependencies]
# Local-only PO sheet sync (python -m po_sync)
sync = [
    "gspread>=6.1",
    "google-auth>=2.32",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
