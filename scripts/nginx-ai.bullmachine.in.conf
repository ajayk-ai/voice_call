# Common reverse proxy for all AI projects on this server: one domain, one path per app, everything on port 80.
#   http://ai.bullmachine.in/        costing (also answers the bare server IP, as before)
#   http://ai.bullmachine.in/scm/    PO follow-up voice agent (this repo)
#
# Install: sudo cp scripts/nginx-ai-proxy.conf /etc/nginx/snippets/ai-proxy.conf
#          sudo cp scripts/nginx-ai.bullmachine.in.conf /etc/nginx/sites-available/ai.bullmachine.in
#          sudo ln -sf /etc/nginx/sites-available/ai.bullmachine.in /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d ai.bullmachine.in      (HTTPS + redirect)
#
# Add a new app: copy the /scm/ pair of locations, change the path and port, then nginx -t and reload.
# The trailing slash on proxy_pass strips the path, so the app still sees "/". The app's pages must use
# relative URLs (assets/app.css, not /assets/app.css) or they load from the costing app instead.
# Every app must listen on 127.0.0.1:<port> only, so it is reachable through this proxy and not directly.

# WebSocket upgrade (call audio streams); plain HTTP requests get "close"
map $http_upgrade $ai_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ai.bullmachine.in _;

    # scm: PO follow-up voice agent (voice_call repo)
    location = /scm {
        return 301 /scm/;
    }
    location /scm/ {
        client_max_body_size 30M;
        proxy_pass http://127.0.0.1:8081/;
        include /etc/nginx/snippets/ai-proxy.conf;
        proxy_set_header X-Forwarded-Prefix /scm;
    }

    # costing: SAP workbook costing tool (costing repo); keep body size in step with MAX_UPLOAD_MB
    location / {
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/ai-proxy.conf;
    }
}
