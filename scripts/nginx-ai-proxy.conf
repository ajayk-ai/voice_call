# Shared proxy settings for every app in nginx-ai.bullmachine.in.conf
# Install: sudo cp scripts/nginx-ai-proxy.conf /etc/nginx/snippets/ai-proxy.conf

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $ai_connection;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Long calls and large uploads; no buffering so streamed responses go out immediately
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
