# Install: sudo cp scripts/nginx-scm.ai.bullmachine.in.conf /etc/nginx/sites-available/scm.ai.bullmachine.in
#          sudo ln -s /etc/nginx/sites-available/scm.ai.bullmachine.in /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d scm.ai.bullmachine.in      (adds HTTPS and the HTTP -> HTTPS redirect)

# WebSocket upgrade for the call audio stream
map $http_upgrade $scm_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name scm.ai.bullmachine.in;
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $scm_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
