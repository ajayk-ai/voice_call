services:
  - type: web
    name: voice-call
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELER_API_KEY
        sync: false
      - key: FREJUN_PHONE_NUMBER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Vendor WhatsApp replies -> Vendor_Replies tab (POST /webhooks/ultramsg?secret=...)
      - key: ULTRAMSG_WEBHOOK_SECRET
        sync: false
      - key: PO_SHEET_ID
        sync: false
      - key: GOOGLE_DELEGATED_USER
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Optional: LangSmith traces of live calls
      - key: LANGSMITH_TRACING
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
