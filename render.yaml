services:
  - type: web
    name: voice-call
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn voice_agent.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELER_API_KEY
        sync: false
      - key: FREJUN_PHONE_NUMBER
        sync: false
      - key: APP_PASSWORD
        sync: false
